<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeySasa!</title>
    <script>
      // Apply the saved theme before first paint so a reload never flashes light.
      // Only for signed-in app routes (a Supabase session token exists); the
      // public landing/login pages stay light. Mirrors ThemeContext.jsx.
      (function () {
        try {
          if (localStorage.getItem('heysasa-theme') !== 'dark') return;
          var publicPaths = ['/login', '/signup', '/pricing', '/terms', '/privacy', '/contact', '/contact-us'];
          if (publicPaths.indexOf(location.pathname) !== -1) return;
          var signedIn = false;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && /^sb-.*-auth-token$/.test(k)) { signedIn = true; break; }
          }
          if (signedIn) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
